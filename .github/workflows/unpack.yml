
name: Unpack source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Unpack
        run: |
          set -e

          test -f project.zip
          mkdir -p .unpack_tmp
          unzip -q project.zip -d .unpack_tmp

          # If ZIP contains one root folder, copy its contents.
          entries=$(find .unpack_tmp -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$entries" -eq 1 ] && [ -d "$(find .unpack_tmp -mindepth 1 -maxdepth 1 -type d)" ]; then
            root=$(find .unpack_tmp -mindepth 1 -maxdepth 1 -type d)
            rsync -a --exclude='.github' "$root"/ ./
          else
            rsync -a --exclude='.github' .unpack_tmp/ ./
          fi

          rm -rf .unpack_tmp project.zip

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Add source"
            git push
          else
            echo "No changes to commit"
          fi
