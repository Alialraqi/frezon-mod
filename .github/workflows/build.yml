name: Build my shit

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Embed icon (Resources/Icon.png)
        shell: bash
        run: |
          rm -f icon_data.h
          if [ -f Resources/Icon.png ]; then
            xcrun -f clang >/dev/null
            (cd Resources && xxd -i Icon.png > ../icon_data.h)
            # Keep the generated symbol names compatible with the source.
            sed -i '' 's/Icon_png/icon_png/g; s/Icon_png_len/icon_png_len/g' icon_data.h
            echo "icon embedded: $(wc -c < Resources/Icon.png) bytes"
          else
            echo "Resources/Icon.png not found; build will continue without an embedded icon"
          fi

      - name: Build dylib (arm64, iOS)
        run: |
          xcrun -sdk iphoneos clang \
            -arch arm64 \
            -dynamiclib \
            -fobjc-arc \
            -fmodules \
            -I. \
            -miphoneos-version-min=13.0 \
            -framework UIKit -framework Foundation -framework QuartzCore \
            -install_name @rpath/SeedLock.dylib \
            -o SeedLock.dylib SeedLock.m

      - name: Ad-hoc sign
        run: codesign -f -s - menu.dylib

      - name: Show info
        run: |
          file menu.dylib
          otool -L menu.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: menu-dylib
          path: menu.dylib
